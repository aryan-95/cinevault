version: 0.2

phases:

  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing Python dependencies..."
      - python --version
      - pip --version
      - pip install --upgrade pip
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "Running syntax validation..."
      - python -m compileall .

      - echo "Running tests..."
      - pytest -v

  build:
    commands:
      - echo "Build phase started..."
      - echo "CineVault CI build successful"

  post_build:
    commands:
      - echo "CI pipeline completed successfully"

artifacts:
  files:
    - '**/*'